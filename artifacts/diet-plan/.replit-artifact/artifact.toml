kind = "web"
previewPath = "/"
title = "Daily Plate"
description = "A responsive, frontend-only diet planning website with a personal dashboard, weekly meal planner, searchable recipes, and interactive grocery list."
version = "1.0.0"
id = "artifacts/diet-plan"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21783

[services.development]
run = "pnpm --filter @workspace/diet-plan run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/diet-plan", "run", "build" ]
serve = "static"
publicDir = "artifacts/diet-plan/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21783"
BASE_PATH = "/"
